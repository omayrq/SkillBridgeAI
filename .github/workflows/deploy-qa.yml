name: Deploy - QA Environment & Test Automation

on:
  workflow_run:
    workflows: ["Deploy - DEV Environment"]
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-qa:
    name: Deploy to QA & Run Automated Test Matrix
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: qa
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy QA Services
        shell: pwsh
        run: |
          ./scripts/aws-cli/00-verify-prereqs.ps1 -Environment qa -Region ${{ secrets.AWS_REGION || 'us-east-1' }}
          ./scripts/aws-cli/01-bootstrap-env.ps1 -Environment qa -Region ${{ secrets.AWS_REGION || 'us-east-1' }}
          ./scripts/aws-cli/02-deploy-network.ps1 -Environment qa -Region ${{ secrets.AWS_REGION || 'us-east-1' }}
          ./scripts/aws-cli/03-deploy-security.ps1 -Environment qa -Region ${{ secrets.AWS_REGION || 'us-east-1' }}
          ./scripts/aws-cli/04-deploy-data.ps1 -Environment qa -Region ${{ secrets.AWS_REGION || 'us-east-1' }}
          ./scripts/aws-cli/05-deploy-api.ps1 -Environment qa -Region ${{ secrets.AWS_REGION || 'us-east-1' }}
          ./scripts/aws-cli/06-deploy-edge.ps1 -Environment qa -Region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Execute Full QA Automation Matrix
        run: |
          node --test tests/**/*.test.js

      - name: Run Synthetic Health & Strict SLA Verification
        shell: pwsh
        run: |
          ./scripts/aws-cli/07-health-check.ps1 -Environment qa -MaxLatencyMs 300
